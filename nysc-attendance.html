<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYSC CDS Attendance</title>
<style>
/* Layout: the PCM dashboard as shipped — one centred 640px column, floating pill nav, alerts button bottom-right. */
:root {
  /* Sampled from the live PCM dashboard */
  --bg: #f1f9f5;
  --card: #ffffff;
  --fg: #172620;
  --muted: #5a7268;
  --border: #d9e8e1;
  --primary: #1b7e53;
  --primary-fg: #ffffff;
  --soft: #e8f2ed;
  --soft-fg: #1b7e53;
  --warn: #d17c2c;
  --warn-soft: #fdf3e6;
  --danger: #dd2c2c;
  --danger-soft: #fdeaea;
  --nav: rgb(255 255 255 / .85);
  --pill: #f1f6f4;
  --pill-fg: #3e7a5a;
  --ok-dot: #45b883;
  --shadow: 0 8px 32px rgb(36 66 53 / .06);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.page { max-width: 640px; margin: 0 auto; padding: 16px 16px 140px; display: flex; flex-direction: column; gap: 22px; }

/* Demo strip (preview only) */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; padding: 8px 10px; }
.demo b { font-weight: 600; margin-right: 4px; }
.demo button { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.demo button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }

/* Header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.head .hello { color: var(--muted); font-size: 15px; }
.editable { cursor: pointer; }
.head h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.head .code { font-size: 13px; color: var(--muted); margin-top: 4px; }
.date-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; flex: none; }
.date-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.sec-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--primary); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.spin svg { animation: spin .7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

#view { display: flex; flex-direction: column; gap: 26px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.empty { padding: 48px 20px; display: grid; justify-items: center; gap: 14px; text-align: center; color: var(--muted); }
.empty .ico { width: 56px; height: 56px; border-radius: 14px; background: var(--soft); color: var(--primary); display: grid; place-items: center; }
.empty .ico svg { width: 26px; height: 26px; }
.empty small { display: block; font-size: 13px; margin-top: -8px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--soft); color: var(--soft-fg); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.plain { background: var(--bg); color: var(--muted); }

.event-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.event-top h3 { font-size: 18px; font-weight: 800; }
.meta { display: grid; gap: 6px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.meta div { display: flex; align-items: center; gap: 8px; }
.meta svg { width: 16px; height: 16px; flex: none; color: var(--primary); }

.btn { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.block { width: 100%; padding: 13px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

.steps { display: grid; gap: 10px; margin-top: 16px; }
.step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: none; display: grid; place-items: center; }
.step.run .dot { border-color: var(--primary); border-top-color: transparent; animation: spin .8s linear infinite; }
.step.done { color: var(--fg); }
.step.done .dot { background: var(--primary); border-color: var(--primary); }
.step.done .dot::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--primary-fg); border-bottom: 2px solid var(--primary-fg); transform: rotate(-45deg) translate(1px, -1px); }

/* Banners */
.banner { border-radius: 16px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.banner .bi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: rgb(255 255 255 / .2); }
.banner .bi svg { width: 22px; height: 22px; }
.banner b { display: block; font-size: 17px; }
.banner span { font-size: 14px; opacity: .92; }
.banner.called { background: var(--primary); color: var(--primary-fg); box-shadow: 0 0 0 4px var(--soft); animation: nudge 1.4s ease-in-out 3; }
.banner.cleared { background: var(--primary); color: var(--primary-fg); }
@keyframes nudge { 50% { transform: scale(1.012); } }

/* Ticket */
.ticket-top { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 18px; }
.big { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
canvas.qr { width: 104px; height: 104px; image-rendering: pixelated; background: #fff; padding: 5px; border-radius: 8px; border: 1px solid var(--border); }
.perf { border-top: 2px dashed var(--border); margin: 0 16px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; padding: 14px 18px 18px; margin: 0; font-size: 14px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }

.qline { position: relative; height: 10px; border-radius: 999px; background: var(--soft); margin: 14px 0 6px; }
.qfill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--primary); transition: width .5s; }
.qme { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); border: 3px solid var(--card); transform: translate(-50%, -50%); transition: left .5s; }
.qscale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* History */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 14px; }
.stat b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 13px; }
.cal .dow { font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
.cal .d { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 10px; font-variant-numeric: tabular-nums; position: relative; }
.cal .d.cds { font-weight: 700; }
.cal .d.att { background: var(--primary); color: var(--primary-fg); }
.cal .d.late { background: var(--warn-soft); color: var(--warn); }
.cal .d.exc { background: var(--soft); color: var(--soft-fg); }
.cal .d.abs { background: var(--danger-soft); color: var(--danger); }
.cal .d.today { outline: 2px solid var(--primary); outline-offset: -2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.list > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--border); }
.list > div:last-child { border-bottom: 0; }
.list small { display: block; font-size: 12px; color: var(--muted); }

/* Games */
.points { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.points b { font-size: 30px; font-weight: 800; }
.game { display: flex; gap: 14px; align-items: center; padding: 16px 18px; }
.game .gi { width: 48px; height: 48px; border-radius: 14px; background: var(--soft); color: var(--primary); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
.game div { min-width: 0; flex: 1; }
.game b { display: block; }

/* Settings */
.set > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.set > div:last-child { border-bottom: 0; }
.toggle { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--border); position: relative; margin: 0; cursor: pointer; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .2s; }
.toggle:checked { background: var(--primary); }
.toggle:checked::after { transform: translateX(18px); }

/* Forms */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 10px 12px; width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }

.ev { padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 14px; border-radius: 20px; }
.ev-title { font-size: 24px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.pills { display: flex; flex-wrap: wrap; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 9px; background: var(--pill); color: var(--pill-fg); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; min-width: 0; max-width: 100%; }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.wide { flex: 1 1 100%; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ev-rule { border: 0; border-top: 1px solid var(--border); margin: 4px 0 0; width: 100%; }
.ev-status { display: flex; align-items: center; gap: 10px; }
.ev-status b { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; }
.ev-status .chip { font-size: 13px; font-weight: 600; padding: 4px 12px; }
.ev-status .chip::before { display: none; }
.okdot { width: 22px; height: 22px; border-radius: 50%; background: var(--ok-dot); color: #fff; display: grid; place-items: center; flex: none; }
.okdot svg { width: 14px; height: 14px; }
.ev-num { text-align: center; }
.ev-num .num { font-size: 46px; font-weight: 800; color: var(--primary); letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ev-num p { font-size: 13px; margin-top: 2px; }
.qr-box { align-self: center; width: min(100%, 268px); border: 0; border-radius: 18px; padding: 18px; display: grid; justify-items: center; gap: 10px; background: #fff; }
.qr-box canvas.qr { background: none; width: 100%; height: auto; aspect-ratio: 1; padding: 0; border: 0; border-radius: 0; image-rendering: pixelated; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 420px) { .ev { padding: 20px 18px 18px; } .pill { font-size: 13.5px; padding: 6px 12px; } }

/* Bottom nav */
.nav { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 7px; background: var(--nav); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow); width: min(512px, calc(100% - 32px)); z-index: 20; }
.nav button { border: 0; background: none; color: var(--muted); height: 40px; min-width: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px; position: relative; transition: flex .25s, background .2s; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button span { display: none; }
.nav button[aria-current="page"] { flex: 1; background: var(--primary); color: var(--primary-fg); }
.nav button[aria-current="page"] span { display: inline; }
.nav button:not([aria-current="page"]):hover { color: var(--fg); background: var(--soft); }
.nav .dotb { position: absolute; top: -2px; right: 2px; min-width: 18px; height: 18px; border-radius: 999px; background: var(--ok-dot); color: #fff; font-size: 11px; font-weight: 700; font-style: normal; display: grid; place-items: center; padding: 0 5px; }

.fab { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; box-shadow: 0 8px 24px rgb(27 126 83 / .3); z-index: 21; }
.fab svg { width: 22px; height: 22px; }
.fab .badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; border: 2px solid var(--bg); }
@media (min-width: 760px) { .fab { bottom: 84px; right: 10px; } }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(8 20 14 / .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.grab { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 4px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-head h3 { font-size: 19px; font-weight: 800; }
.alert-item { border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
.alert-item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.alert-item p { font-size: 14px; }
.up { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; justify-self: start; }
.up[aria-pressed="true"] { background: var(--soft); color: var(--soft-fg); border-color: transparent; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -20px); opacity: 0; visibility: hidden; pointer-events: none; width: min(440px, calc(100% - 32px)); background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 14px; box-shadow: var(--shadow); z-index: 40; transition: transform .3s, opacity .3s, visibility .3s; }
.toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
.toast b { display: block; }

@media (max-width: 420px) {
  .head h1 { font-size: 28px; }
  .big { font-size: 52px; }
  canvas.qr { width: 88px; height: 88px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="page">

  <header class="head">
    <div>
      <p class="hello" id="greet">Good afternoon,</p>
      <h1 id="hName" class="editable" data-act="edit" role="button" tabindex="0" title="Tap to edit">Abdulbasit</h1>
      <p class="code">State code: <span class="mono" id="hCode">LA/26B/2941</span></p>
    </div>
    <span class="date-pill" id="datePill">Wed, 7 Oct</span>
  </header>

  <main id="view"></main>
</div>

<button class="fab" id="fab" type="button" aria-label="Community updates, 5 new">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 15-6v14L3 13z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
  <span class="badge" id="fabBadge">5</span>
</button>

<nav class="nav" aria-label="Main">
  <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button type="button" data-tab="history" aria-label="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg><span>History</span></button>
  <button type="button" data-tab="games" aria-label="Games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg><span>Games</span></button>
  <button type="button" data-tab="alerts" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Alerts</span><i class="dotb" id="notifDot">1</i></button>
  <button type="button" data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheetRoot"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DEFAULTS = { name: "Abdulbasit", code: "LA/26B/2941", event: "B1 monthly clearance", time: "06:00 – 10:00", address: "1-7 Muri Okunola St, Victoria Island, Lagos", num: "731", checkinAt: "08:17", status: "Pending clearance" };
  const D = Object.assign({}, DEFAULTS);
  try { Object.assign(D, JSON.parse(localStorage.getItem("nysc-details") || "{}")); } catch (_) {}
  const saveD = () => { try { localStorage.setItem("nysc-details", JSON.stringify(D)); } catch (_) {} };
  const NOW = new Date();
  const TODAY_SHORT = NOW.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const TODAY_LONG = NOW.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).replace(/^(\w+)\s/, "$1, ");

  const I = {

  function drawCode(c, text) {
    const n = 57, x = c.getContext("2d"); c.width = c.height = n + 2;
    const ink = "#6b2541";
    let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
    x.fillStyle = "#fff"; x.fillRect(0, 0, n + 2, n + 2); x.translate(1, 1); x.fillStyle = ink;
    for (let y = 0; y < n; y++) for (let i = 0; i < n; i++) if (r() > .5) x.fillRect(i, y, 1, 1);
    const sq = (a, b, s) => { x.fillStyle = "#fff"; x.fillRect(a - 1, b - 1, s + 2, s + 2); x.fillStyle = ink; x.fillRect(a, b, s, s); x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, s - 2, s - 2); x.fillStyle = ink; x.fillRect(a + 2, b + 2, s - 4, s - 4); };
    sq(0, 0, 7); sq(n - 7, 0, 7); sq(0, n - 7, 7);
    const al = (a, b) => { x.fillStyle = ink; x.fillRect(a, b, 5, 5); x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, 3, 3); x.fillStyle = ink; x.fillRect(a + 2, b + 2, 1, 1); };
    const P = [6, 28, 50]; P.forEach(a => P.forEach(b => { if (!((a === 6 && b === 6) || (a === 50 && b === 6) || (a === 6 && b === 50))) al(a - 2, b - 2); }));
    for (let i = 8; i < n - 8; i++) { x.fillStyle = i % 2 ? "#fff" : ink; x.fillRect(i, 6, 1, 1); x.fillRect(6, i, 1, 1); }
  }

  $("#datePill").textContent = TODAY_LONG;
  const h = new Date().getHours();
  $("#greet").textContent = h < 12 ? "Good morning," : h < 17 ? "Good afternoon," : "Good evening,";
  render();
})();
</script>
</body>
</html>
